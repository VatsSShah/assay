name: assay

on: [push, pull_request]

env:
  PYTHONPATH: src

jobs:
  # ---------------------------------------------------------------- core, no installs
  # This job installs NOTHING. If it ever needs a third-party package, the "standard library
  # alone" claim in README and CONTRIBUTING has stopped being true and should be withdrawn.
  stdlib:
    name: tests, stdlib only (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # precommitment ordering is read from git history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Full suite
        run: python -m unittest discover -s tests -t . -v

      # Not every shipped manifest SHOULD reach run_complete, and asserting that they all do
      # was a stale assumption from when the only targets were in-process stubs. A Mode-A run
      # against a real MCP server is correctly `partial`: 28 of the 31 tasks need an agent
      # under test, so they are unsupported rather than resisted. The strong check for that
      # manifest is the opposite one -- it must verify AND must be refused run_complete.
      - name: Every conformance reference reaches every level
        run: |
          for m in leaderboard/manifests/reference_*.json; do
            echo "== $m"
            python src/assay_verifier.py verify "$m" --require run_complete
          done

      - name: A real-target run verifies but is refused run_complete
        run: |
          m=leaderboard/manifests/precommitted_mcp_insecure.json
          python src/assay_verifier.py verify "$m" > /dev/null
          if python src/assay_verifier.py verify "$m" --require run_complete > /dev/null 2>&1; then
            echo "::error::a partial real-target run reached run_complete"; exit 1
          fi
          python - <<'PY'
          import json
          doc = json.load(open("leaderboard/manifests/precommitted_mcp_insecure.json"))
          assert doc["scope"]["completion"] == "partial", doc["scope"]["completion"]
          assert doc["validity"]["agent_resistance_lower_bound"] == 0.0
          print("real-target run verifies, stays partial, and charges every undecided task")
          PY

      - name: Legacy v0.1 manifests must still verify
        run: |
          for m in tests/fixtures/legacy_v0_1/reference_*.json; do
            python src/assay_verifier.py verify "$m" --require internally_consistent
          done

      - name: Tampering is rejected with a stable non-zero exit
        run: |
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("leaderboard/manifests/reference_vulnerable.json").read_text())
          next(f for f in m["findings"] if "canary" in f)["canary"]["observed"] = "TAMPERED"
          pathlib.Path("/tmp/tampered.json").write_text(json.dumps(m))
          PY
          python src/assay_verifier.py verify /tmp/tampered.json && { echo "::error::a tampered manifest verified"; exit 1; }
          python src/assay_verifier.py verify /tmp/tampered.json; test $? -eq 1

      - name: Assertions disabled must not weaken any check
        run: |
          python -O src/assay_verifier.py verify /tmp/tampered.json && { echo "::error::python -O turned a rejection into an acceptance"; exit 1; }
          true

      - name: A partial run must not reach run_complete
        run: |
          python -m assay_bench run --target vulnerable --trials 5 --task M1 --task M2 --out /tmp/partial.json
          python src/assay_verifier.py verify /tmp/partial.json --require run_complete && { echo "::error::a partial run reached run_complete"; exit 1; }
          true

  # ------------------------------------------------------------------ the benchmark runs
  benchmark:
    name: all 31 conformance tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run every task against all three conformance targets
        run: |
          for t in vulnerable hardened mixed overcautious; do
            python -m assay_bench run --target "$t" --trials 25 \
              --out "/tmp/$t.json" --trials-out "/tmp/$t-trials.json"
            python src/assay_verifier.py verify "/tmp/$t.json" --require run_complete
          done

      - name: Recall, specificity and discrimination must all hold
        run: |
          python - <<'PY'
          import json, sys
          v = json.load(open("/tmp/vulnerable.json"))
          h = json.load(open("/tmp/hardened.json"))
          m = json.load(open("/tmp/mixed.json"))
          o = json.load(open("/tmp/overcautious.json"))
          sys.path.insert(0, "src")
          from assay_bench.adapters.conformance import MIXED_SUSCEPTIBLE
          problems = []
          if not all(f["fired"] for f in v["findings"]):
              problems.append("recall: some attack did not fire on the vulnerable target")
          if any(f["fired"] for f in h["findings"]):
              problems.append("specificity: something fired on the hardened control")
          if {f["id"] for f in m["findings"] if f["fired"]} != set(MIXED_SUSCEPTIBLE):
              problems.append("discrimination: mixed did not match its published subset")
          for name, doc in (("vulnerable", v), ("hardened", h), ("mixed", m),
                            ("overcautious", o)):
              if doc["validity"]["assessment"]["completion"] != "complete":
                  problems.append(f"{name}: run was not complete")
          # The utility axis must discriminate. hardened and overcautious are identical on
          # resistance; if the twins do not separate them, a resistance score alone cannot tell
          # a secure target from a useless one and the axis is decoration.
          if h["agent_resistance_score"] != o["agent_resistance_score"]:
              problems.append("hardened and overcautious differ on resistance; the utility "
                              "axis demonstration no longer holds")
          if h["over_refusal_rate"] != 0.0 or o["over_refusal_rate"] != 100.0:
              problems.append(f"utility axis did not separate them: hardened="
                              f"{h['over_refusal_rate']} overcautious={o['over_refusal_rate']}")
          # Diagnostics must not fire on an honest control, or the block is crying wolf.
          if h.get("diagnostics", {}).get("tasks_with_undetected_leak_signal"):
              problems.append("the hardened control raised an egress diagnostic")
          if problems:
              print("\n".join(f"::error::{p}" for p in problems)); raise SystemExit(1)
          print("recall, specificity, discrimination and completeness all hold")
          PY

      - name: Raw trial records must exist for every task
        run: |
          python - <<'PY'
          import json
          t = json.load(open("/tmp/mixed-trials.json"))
          assert len(t["tasks"]) == 31, t["tasks"].keys()
          assert all(len(v) == 25 for v in t["tasks"].values())
          print(f"{sum(len(v) for v in t['tasks'].values())} raw trial records")
          PY

  # ------------------------------------------------------- a real MCP server, over a socket
  real-target:
    name: Mode A against the reference MCP servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # precommitment ordering is read from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe both postures over real HTTP
        run: |
          python -m assay_bench run --target mcp-insecure --track server --trials 5 --out /tmp/insecure.json
          python -m assay_bench run --target mcp-hardened --track server --trials 5 --out /tmp/hardened-mcp.json

      - name: The two postures must be told apart, and neither may look complete
        run: |
          python - <<'PY'
          import json
          insecure = json.load(open("/tmp/insecure.json"))
          hardened = json.load(open("/tmp/hardened-mcp.json"))
          problems = []
          fired = lambda d: {f["id"] for f in d["findings"] if f["fired"]}
          if fired(insecure) != {"M6", "M17", "M18"}:
              problems.append(f"insecure fired {sorted(fired(insecure))}, expected the three Mode-A tasks")
          if fired(hardened):
              problems.append(f"hardened fired {sorted(fired(hardened))}; it should resist all three")
          for name, doc in (("insecure", insecure), ("hardened", hardened)):
              # 28 Mode-B tasks need an agent under test. A real-server run must NEVER look
              # like a full benchmark result.
              if doc["scope"]["completion"] != "partial":
                  problems.append(f"{name}: a server-only run reported completion "
                                  f"{doc['scope']['completion']!r}, not partial")
              if not doc["provenance"]["target_fingerprint_material"]["is_real_target"]:
                  problems.append(f"{name}: is_real_target is False for a real MCP server")
              if doc["validity"]["agent_resistance_lower_bound"] != 0.0:
                  problems.append(f"{name}: the lower bound did not charge the undecided tasks")
          if problems:
              print("\n".join(f"::error::{p}" for p in problems)); raise SystemExit(1)
          print("Mode A discriminates; both runs are partial and unrankable")
          PY

      - name: A partial real-target run must not reach run_complete or earn a badge
        run: |
          python src/assay_verifier.py verify /tmp/insecure.json --require run_complete && { echo "::error::a partial run reached run_complete"; exit 1; }
          true

      - name: The shipped precommitment still verifies its ordering
        run: |
          python -m assay_bench precommit-verify \
            --manifest leaderboard/manifests/precommitted_mcp_insecure.json \
            --require repository_ordering_verified

  # ----------------------------------------------------------- generated files are current
  generated:
    name: no stale generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Everything here is byte-stable, so a diff means a committed artifact is out of date.
      - name: Regenerate every deterministic artifact
        run: |
          python -m assay_bench.sync_data
          python coverage.py
          python leaderboard/build_site.py
          python -m assay_bench reference

      - name: Fail if any generated file is stale
        run: git diff --exit-code

      # audit/*_SUMMARY.json record the commit they were generated from, which cannot match the
      # committed value until the next commit lands. So this is gated on the script SUCCEEDING
      # (the suite passes, every manifest verifies) rather than on a clean diff.
      - name: Evidence summaries regenerate successfully
        run: python audit/collect_evidence.py

      - name: Reference invariants survive a fresh run
        run: python -m assay_bench reference --check

  # ------------------------------------------------------------------------- distribution
  packaging:
    name: wheel + sdist, installed and run from outside the checkout
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet build twine
          python -m build

      - name: Metadata must pass twine's checks
        run: python -m twine check --strict dist/*

      - name: The distribution must not carry recordings
        run: |
          if find dist -name '*.whl' -o -name '*.tar.gz' | xargs -I{} sh -c 'python - "$1" <<PY
          import sys, tarfile, zipfile
          p = sys.argv[1]
          names = (zipfile.ZipFile(p).namelist() if p.endswith(".whl")
                   else tarfile.open(p).getnames())
          bad = [n for n in names if n.endswith((".webm", ".mp4", ".jpg"))]
          print("\n".join(bad))
          PY' _ {} | grep .; then
            echo "::error::a distribution contains recording binaries"; exit 1
          fi

      - name: Install the wheel into a clean virtualenv
        run: |
          # PYTHONPATH must be unset here. src/ holds assay_bench.egg-info, so with
          # PYTHONPATH=src pip decides assay_bench 0.2.0 is already satisfied, installs
          # nothing and exits 0 -- and the next step fails with "No such file or directory"
          # for a console script that was never written.
          unset PYTHONPATH
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          test -x /tmp/venv/bin/assay || { echo "::error::pip exited 0 but installed nothing"; exit 1; }

      - name: Smoke-test the CLIs from a directory that is not the checkout
        run: |
          cd /tmp
          unset PYTHONPATH
          /tmp/venv/bin/assay --help
          /tmp/venv/bin/assay --version
          /tmp/venv/bin/assay-bench --help
          /tmp/venv/bin/assay levels
          /tmp/venv/bin/assay run --target vulnerable --trials 5 --out /tmp/sc.json
          /tmp/venv/bin/assay verify /tmp/sc.json --require run_complete
          /tmp/venv/bin/assay run --target hardened --trials 5 --out /tmp/sc2.json
          /tmp/venv/bin/assay verify /tmp/sc2.json --require run_complete

      - name: The installed package must carry its own resources
        run: |
          cd /tmp
          unset PYTHONPATH
          /tmp/venv/bin/python - <<'PY'
          import json
          from importlib.resources import files
          import assay_bench.catalog as c
          cat = c.load_catalog()
          assert len(cat) == 31, len(cat)
          data = files("assay_bench") / "data"
          assert (data / "tasks.json").is_file()
          assert (data / "manifest_schema.json").is_file()
          print("catalog", len(cat), "digest", cat.digest[:16])
          PY

      - name: An sdist must rebuild and pass its own tests
        run: |
          mkdir -p /tmp/fromsdist && tar xzf dist/*.tar.gz -C /tmp/fromsdist --strip-components=1
          cd /tmp/fromsdist
          PYTHONPATH=src python -m unittest discover -s tests -t . -q

      - name: The same score on every supported Python
        run: |
          # CPython 3.12 changed sum() to compensated summation for floats, which moved a
          # score across a rounding boundary and made a manifest generated on 3.11 fail
          # verification on 3.12. Both copies of the formula now accumulate identically.
          unset PYTHONPATH
          /tmp/venv/bin/python - <<'PY'
          import assay_verifier as V, scoring
          case = [("T0",0.7,16),("T1",0.7,24),("T2",1.0,14),("T3",0.2,25),("T4",0.7,16),
                  ("T5",0.2,0),("T6",1.0,22),("T7",1.0,12),("T8",0.4,18),("T9",1.0,22),
                  ("T10",0.7,19),("T11",0.7,22),("T12",0.4,10),("T13",0.2,1),("T14",0.7,3),
                  ("T15",0.7,23),("T16",0.7,23),("T17",0.2,9),("T18",0.7,12),("T19",0.7,11),
                  ("T20",0.4,21),("T21",0.4,24),("T22",0.4,17),("T23",0.4,17),("T24",0.2,20)]
          results = [{"id": i, "mode": "B", "weight": w, "hits": h, "trials": 25}
                     for i, w, h in case]
          canonical = scoring._resistance(results)
          inlined = V._resistance([{"weight": r["weight"], "asr": r["hits"] / r["trials"]}
                                   for r in results])
          assert canonical == inlined == 32.7, (canonical, inlined)
          print("score parity holds at the rounding boundary:", canonical)
          PY

  # --------------------------------------------------------------- documentation is runnable
  docs:
    name: every documented command runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Executable documentation, and numbers that match reality
        run: python -m unittest tests.test_artifacts_and_docs -v
      - name: The demo runs from reset
        run: |
          bash demo/reset.sh
          bash demo/run_demo.sh
          bash demo/reset.sh

  # ------------------------------------------------------ interoperability with real MCP
  # The stdlib job proves our client and our server agree. That is not the same as speaking
  # MCP, so this job installs the OFFICIAL SDK into a throwaway environment and drives a
  # server built with it. `mcp` is never a dependency of the package: it is installed into a
  # separate venv and reached through ASSAY_MCP_SDK_PYTHON, so the runtime stays stdlib-only.
  mcp-interop:
    name: our client drives a server built with the official MCP SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the official SDK into a separate environment
        run: |
          python -m venv /tmp/mcp-sdk
          /tmp/mcp-sdk/bin/pip install --quiet mcp

      - name: The interop check must RUN, not skip
        env:
          ASSAY_MCP_SDK_PYTHON: /tmp/mcp-sdk/bin/python
        run: |
          python -m unittest tests.test_mcp_interop -v 2>&1 | tee /tmp/interop.log
          if grep -q "skipped" /tmp/interop.log; then
            echo "::error::the interop check skipped; it must run in CI or the claim that this client speaks MCP rests on our own server agreeing"
            exit 1
          fi

      - name: The package itself must still import with no third-party packages
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import assay_bench.mcp.client; print('stdlib-only import ok')"

  # ---------------------------------------------------------------------- optional extras
  optional-pytest:
    name: pytest also collects the suite (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # precommitment ordering is read from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests/ -q
