name: assay
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The whole standard runs on the standard library alone, no install step needed.
      - name: Verify reference scorecards (stdlib only)
        run: |
          python assay_verifier.py leaderboard/manifests/reference_vulnerable.json
          python assay_verifier.py leaderboard/manifests/reference_hardened.json
      - name: Re-verify + rebuild leaderboard (every entry's manifest must verify)
        run: python leaderboard/build_site.py
      - name: Render coverage matrix
        run: python coverage.py
      - name: Verifier tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q
